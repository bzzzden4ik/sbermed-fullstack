# SIRIUS — Nginx site. Frontend (built SPA) + reverse proxy to FastAPI under /api, HTTPS only.
# Installed as /etc/nginx/sites-available/sirius by deploy/update.sh.
# Certificate: Let's Encrypt via `certbot certonly --webroot -w /var/www/certbot -d sirius.data-cdn.top`
# (renewed automatically by the certbot timer; nginx is reloaded by a renewal deploy hook).

# --- Backend: 4 Gunicorn workers behind one port, reused keep-alive connections ---------------
upstream sirius_api {
    server 127.0.0.1:8000;
    keepalive 32;
    keepalive_timeout 4s;   # shorter than Gunicorn keep-alive (5 s): Nginx closes idle connections first
}

# --- Rate limits ------------------------------------------------------------------------------
# Generous per-IP limits: at a demo many visitors share one public IP (venue Wi-Fi).
limit_req_zone $binary_remote_addr zone=sirius_api:10m rate=150r/s;
# AI requests (paid OpenAI calls) are limited per signed-in user (token), and only for POST.
map $request_method $sirius_ai_key {
    POST    $http_authorization;
    default "";
}
limit_req_zone $sirius_ai_key zone=sirius_ai:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

# HTTP: only certificate challenges; everything else (domain or bare IP) goes to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sirius.data-cdn.top$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name sirius.data-cdn.top;

    ssl_certificate     /etc/letsencrypt/live/sirius.data-cdn.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sirius.data-cdn.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Requests for any other host name (e.g. https://<IP>) go to the canonical domain.
    if ($host != "sirius.data-cdn.top") {
        return 301 https://sirius.data-cdn.top$request_uri;
    }

    # Current frontend release (deploy/update.sh builds into a new folder and switches this link).
    root /opt/sirius/frontend/current;
    index index.html;
    client_max_body_size 12m;   # photos (5 MB), audio, medical records

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MCP is only for the AI agent inside the server, never from the internet.
    location ^~ /api/mcp { return 404; }

    # Public files (doctor photos, uploaded records with unguessable names) served directly.
    location ^~ /api/uploads/ {
        alias /opt/sirius/app/backend/hackathon-hospital/uploads/;
        expires 7d;
    }

    # AI endpoints: per-user limit on new messages / voice transcription, on top of the general limit.
    location ~ ^/api/(conversations|convert_audio_to_text) {
        limit_req zone=sirius_ai burst=5 nodelay;
        limit_req zone=sirius_api burst=400 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://sirius_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI answers can take a while
    }

    # The trailing slash strips the /api prefix: /api/doctors -> backend /doctors.
    location /api/ {
        limit_req zone=sirius_api burst=400 nodelay;
        proxy_pass http://sirius_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Interactive API docs at /api/docs load their schema from /openapi.json.
    location = /openapi.json {
        proxy_pass http://sirius_api/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Vite build assets have hashed names: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # index.html must never be cached, so a new release is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri /index.html;   # SPA routing
    }
}
