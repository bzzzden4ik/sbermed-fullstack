# SIRIUS — Nginx site. Frontend (built SPA) + reverse proxy to FastAPI under /api.
# Installed as /etc/nginx/sites-available/sirius. For HTTPS later: certbot --nginx -d <domain>.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/sirius/app/frontend/SberMedAI/dist;
    index index.html;
    client_max_body_size 12m;   # photos (5 MB), audio, medical records

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MCP is only for the AI agent inside the server, never from the internet.
    location /api/mcp { return 404; }

    # Public files (doctor photos, uploaded records with unguessable names) served directly.
    location /api/uploads/ {
        alias /opt/sirius/app/backend/hackathon-hospital/uploads/;
        expires 7d;
    }

    # The trailing slash strips the /api prefix: /api/doctors -> backend /doctors.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # AI answers can take a while
    }

    # Interactive API docs at /api/docs load their schema from /openapi.json.
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
    }

    # Vite build assets have hashed names: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;   # SPA routing
    }
}
