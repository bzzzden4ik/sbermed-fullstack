<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ИИ-ассистент — SIRIUS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--serif:"Instrument Serif","Times New Roman",serif;--sans:"Inter",system-ui,sans-serif;
--ink:#1C2227;--ink2:#6A7279;--line:#E4E1DA;--bg:#FAF8F4;--bg2:#F2F0EA;--card:#fff;--acc:#0F5B68;--tint:#E3EEEE;--mint:#8FD9C4;--rec:#E5484D;--hdr:rgba(250,248,244,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#EDEBE6;--ink2:#9AA3A9;--line:#2D353B;--bg:#12171A;--bg2:#181F23;--card:#1D252A;--acc:#5CB8C6;--tint:#1B2D31;--hdr:rgba(18,23,26,.82)}}
:root[data-theme="dark"]{--ink:#EDEBE6;--ink2:#9AA3A9;--line:#2D353B;--bg:#12171A;--bg2:#181F23;--card:#1D252A;--acc:#5CB8C6;--tint:#1B2D31;--hdr:rgba(18,23,26,.82)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}svg{display:block}p{margin:0}button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .3s,color .3s,transform .3s;flex:none}.ibtn:hover,.ibtn.on{background:var(--bg2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:13px 22px;font:500 15px var(--sans);cursor:pointer;transition:background .3s,transform .3s,box-shadow .3s}
.btn:hover{background:var(--acc);color:#fff;transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(15,91,104,.55)}.btn:active{transform:scale(.97)}
/* header */
.header{flex:none;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:50}
.hnav{height:68px;width:min(1480px,100% - 32px);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font:400 26px var(--serif);letter-spacing:.2em}
.logo i,.av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2A8796,#0F5B68 60%);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(15,91,104,.1),0 6px 16px -4px rgba(15,91,104,.6);flex:none}
.menu{display:flex;list-style:none;margin:0;padding:0;gap:6px}.menu a{display:block;padding:8px 14px;border-radius:99px;font-size:14px;color:var(--ink2);transition:.25s}.menu a:hover,.menu a.cur{color:var(--ink);background:var(--bg2)}
.hright{display:flex;align-items:center;gap:4px}#burger{display:none}
/* app */
.app{flex:1;min-height:0;width:min(1480px,100% - 32px);margin:16px auto;display:grid;grid-template-columns:330px 1fr;gap:16px}
.side{background:var(--bg2);border:1px solid var(--line);border-radius:32px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-h{padding:24px 20px 14px}.side-h h2{font-size:34px;margin-bottom:16px}.side-h .btn{width:100%}
.find{margin:0 20px 8px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 16px;color:var(--ink2)}
.find input{flex:1;min-width:0;border:0;background:transparent;font:400 14px var(--sans);color:var(--ink);padding:11px 0}.find input:focus{outline:0}.find:focus-within{border-color:var(--acc)}
.hist{flex:1;overflow-y:auto;padding:6px 12px 16px}
.grp{font-size:12px;color:var(--ink2);padding:14px 10px 6px}
.cv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:20px;padding:12px 12px 12px 14px;cursor:pointer;transition:background .25s}
.cv:hover{background:var(--card)}.cv.on{background:var(--card);box-shadow:0 14px 30px -20px rgba(28,34,39,.45),inset 3px 0 0 var(--acc)}
.cv div{flex:1;min-width:0}.cv b{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .x{opacity:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:.2s}.cv:hover .x{opacity:1}.cv .x:hover{background:var(--bg2);color:var(--rec)}
.empty-h{padding:30px 16px;text-align:center;color:var(--ink2);font-size:13px}
/* canvas */
.chat{background:var(--card);border:1px solid var(--line);border-radius:32px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.chat::before{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-240px;border-radius:50%;border:1px solid rgba(15,91,104,.18);box-shadow:0 0 0 70px rgba(15,91,104,.04),0 0 0 140px rgba(15,91,104,.03);pointer-events:none}
.top{position:relative;display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);font-weight:500}
.top small{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:400;font-size:12px}.top small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(143,217,196,.3)}
.top .av{width:40px;height:40px}.top .sp{flex:1}
.log{position:relative;flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.row{display:flex;gap:12px;max-width:min(720px,92%);animation:pop .4s cubic-bezier(.2,.8,.2,1)}.row.u{align-self:flex-end;flex-direction:row-reverse}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.row .av{width:30px;height:30px;box-shadow:none;margin-top:2px}
.msg{padding:12px 18px;border-radius:22px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.u .msg{background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}.b .msg{background:var(--bg2);border-bottom-left-radius:6px}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.slots button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:400 13px var(--sans);cursor:pointer;transition:.25s}.slots button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.typing{display:flex;gap:5px;padding:16px 18px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink2);animation:dot 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{30%{transform:translateY(-5px);opacity:.4}}
.vm{display:flex;align-items:center;gap:12px;min-width:min(260px,70vw)}
.vm .pl{width:38px;height:38px;border-radius:50%;border:0;background:var(--mint);color:#0A4651;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .25s}.vm .pl:hover{transform:scale(1.08)}
.bars{flex:1;height:30px;display:flex;align-items:center;gap:2px}.bars i{flex:1;min-width:2px;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}.bars i.f{opacity:1}
.vm time{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.welcome{margin:auto;text-align:center;max-width:520px;animation:pop .6s}
.welcome .orb{width:84px;height:84px;margin:0 auto 24px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2A8796,#0F5B68 62%);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(15,91,104,.1),0 0 0 26px rgba(15,91,104,.05)}
.welcome h2{font-size:clamp(34px,4vw,52px);line-height:1}.welcome h2 i{color:var(--acc)}.welcome p{color:var(--ink2);margin:14px 0 24px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips button{border:1px dashed var(--ink2);background:transparent;color:var(--ink2);border-radius:99px;padding:7px 16px;font:400 13px var(--sans);cursor:pointer;transition:.25s}.chips button:hover{border-color:var(--acc);color:var(--acc)}
/* composer */
.comp{position:relative;padding:8px clamp(12px,3vw,40px) 18px}
.pill{position:relative;display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:30px;padding:6px 6px 6px 20px;min-height:58px;transition:border-color .3s,box-shadow .3s}
.pill:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(15,91,104,.1)}
.pill textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;font:400 15px/1.5 var(--sans);color:var(--ink);padding:12px 0;max-height:140px}.pill textarea:focus{outline:0}
.act{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .3s,transform .3s,color .3s;position:relative}
.mic{background:transparent;color:var(--ink)}.mic:hover{background:var(--tint);color:var(--acc)}
.snd{background:var(--ink);color:var(--bg);display:none}.snd:hover{background:var(--acc);color:#fff}.pill.has .snd{display:grid}.pill.has .mic{display:none}
/* recording state */
.rec{position:absolute;inset:0;border-radius:30px;background:var(--card);display:flex;align-items:center;gap:12px;padding:6px 6px 6px 8px;opacity:0;pointer-events:none;transform:scale(.97);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.pill.rc{border-color:var(--rec);box-shadow:0 0 0 6px rgba(229,72,77,.1)}.pill.rc .rec{opacity:1;pointer-events:auto;transform:none}
.rec .trash{background:var(--bg2);color:var(--ink)}.rec .trash:hover{background:rgba(229,72,77,.12);color:var(--rec)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--rec);flex:none;animation:rp 1.2s infinite}@keyframes rp{0%{box-shadow:0 0 0 0 rgba(229,72,77,.6)}100%{box-shadow:0 0 0 12px rgba(229,72,77,0)}}
.rtime{font:500 14px var(--sans);font-variant-numeric:tabular-nums;min-width:40px}
.wave{flex:1;min-width:0;height:44px;display:block;width:100%}
.rec .snd{display:grid;position:relative}
.rec .snd::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--mint);opacity:0;animation:ring 1.8s infinite}@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.hint{text-align:center;font-size:11px;color:var(--ink2);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:90;background:var(--ink);color:var(--bg);border-radius:99px;padding:11px 20px;font-size:14px;opacity:0;pointer-events:none;transition:.35s;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media(max-width:960px){.menu{display:none}#burger{display:grid}.app{grid-template-columns:1fr;margin:8px auto 0}
 .side{position:fixed;z-index:80;left:8px;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,100% - 16px);transform:translateX(-110%);transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 40px 80px -20px rgba(0,0,0,.5)}
 .side.open{transform:none}.scrim.on{display:block;position:fixed;inset:0;z-index:70;background:rgba(28,34,39,.35);backdrop-filter:blur(4px)}
 .chat,.side{border-radius:26px}.chat{margin-bottom:calc(8px + env(safe-area-inset-bottom,0px))}}
@media(max-width:560px){.logo{font-size:22px}.row{max-width:100%}.top{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="header"><div class="hnav">
 <div style="display:flex;align-items:center;gap:8px"><button class="ibtn" id="burger" aria-label="История диалогов"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
 <a class="logo" href="#"><i><svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 21.5s-8.5-5.4-8.5-11.6A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.9c0 6.2-8.5 11.6-8.5 11.6z" fill="#fff"/><path d="M5.5 12.5h3.2l1.6-3.2 2.6 6 1.8-2.8h3.8" fill="none" stroke="#0F5B68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></i>SIRIUS</a></div>
 <ul class="menu"><li><a href="#">Направления</a></li><li><a href="#">Врачи</a></li><li><a href="#" class="cur">ИИ-ассистент</a></li><li><a href="#">Личный кабинет</a></li></ul>
 <div class="hright"><button class="ibtn" aria-label="Уведомления"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg></button><button class="ibtn" aria-label="Личный кабинет"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="7.5" r="4"/><path d="M4 21v-1.5a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5V21"/></svg></button></div>
</div></header>

<div class="app">
 <aside class="side" id="side">
  <div class="side-h"><h2>Диалоги</h2><button class="btn" id="newBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Новый диалог</button></div>
  <label class="find"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" placeholder="Поиск по диалогам" aria-label="Поиск по диалогам"></label>
  <div class="hist" id="hist"></div>
 </aside>
 <div class="scrim" id="scrim"></div>

 <section class="chat">
  <div class="top"><div class="av"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c.8 7.2 4.8 11.2 12 12-7.2.8-11.2 4.8-12 12-.8-7.2-4.8-11.2-12-12C7.2 11.2 11.2 7.2 12 0z"/></svg></div><div><div>Ассистент SIRIUS</div><small>на связи 24/7</small></div><span class="sp"></span></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="comp">
   <div class="pill" id="pill">
    <textarea id="inp" rows="1" placeholder="Опишите, что вас беспокоит…" aria-label="Сообщение"></textarea>
    <button class="act mic" id="micBtn" aria-label="Записать голосовое сообщение"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="act snd" id="sendBtn" aria-label="Отправить"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    <div class="rec" id="rec" aria-hidden="true">
     <button class="act trash" id="cancelRec" aria-label="Отменить запись"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
     <span class="rdot"></span><span class="rtime" id="rtime">0:00</span>
     <canvas class="wave" id="wave"></canvas>
     <button class="act snd" id="sendRec" aria-label="Отправить запись"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </div>
   </div>
   <p class="hint">Enter — отправить, Shift+Enter — новая строка. Ассистент не заменяет очную консультацию врача.</p>
  </div>
 </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SPARK='<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c.8 7.2 4.8 11.2 12 12-7.2.8-11.2 4.8-12 12-.8-7.2-4.8-11.2-12-12C7.2 11.2 11.2 7.2 12 0z"/></svg>';
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
let convs=[
 {id:1,title:"Головная боль по вечерам",group:"Сегодня",msgs:[{r:"u",t:"Последние дни болит голова по вечерам, плохо сплю."},{r:"b",t:"Понимаю, это неприятно. Подскажите, боль давит или пульсирует, и бывает ли тошнота? Пока могу предложить консультацию невролога.",slots:["Завтра, 10:30","Завтра, 14:00","Пт, 09:15"]}]},
 {id:2,title:"Запись к кардиологу",group:"Вчера",msgs:[{r:"u",t:"Хочу записаться к кардиологу на проверку давления."},{r:"b",t:"Подобрала специалиста: Петрова Мария Сергеевна, кардиолог, доктор медицинских наук. Вы записаны на 12 мар., 11:00. Напоминание придёт за сутки."}]},
 {id:3,title:"Проверка зрения",group:"Ранее",msgs:[{r:"u",t:"Нужна проверка зрения для очков."},{r:"b",t:"Рекомендую офтальмолога. Свободное время есть на этой неделе."}]}
];
let cur=convs[0].id,nid=10;
const get=()=>convs.find(c=>c.id===cur);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}

/* history */
function drawHist(){
 const q=$("q").value.trim().toLowerCase(),h=$("hist");h.innerHTML="";
 const list=convs.filter(c=>!q||c.title.toLowerCase().includes(q));
 if(!list.length){h.innerHTML='<div class="empty-h">Ничего не найдено</div>';return}
 let g="";list.forEach(c=>{
  if(c.group!==g){g=c.group;h.insertAdjacentHTML("beforeend",`<div class="grp">${g}</div>`)}
  const last=c.msgs[c.msgs.length-1],pv=last?(last.v?"Голосовое сообщение":last.t):"Пустой диалог";
  const b=document.createElement("button");b.className="cv"+(c.id===cur?" on":"");
  b.innerHTML=`<div><b>${esc(c.title)}</b><small>${esc(pv)}</small></div><span class="x" role="button" aria-label="Удалить диалог"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></span>`;
  b.onclick=e=>{if(e.target.closest(".x")){del(c.id);return}cur=c.id;drawHist();drawLog();closeSide()};
  h.appendChild(b)})
}
function del(id){convs=convs.filter(c=>c.id!==id);if(!convs.length)newConv();else if(cur===id)cur=convs[0].id;drawHist();drawLog()}
function newConv(){const e=convs.find(c=>!c.msgs.length);if(e){cur=e.id}else{const c={id:nid++,title:"Новый диалог",group:"Сегодня",msgs:[]};convs.unshift(c);cur=c.id}drawHist();drawLog();closeSide();$("inp").focus()}

/* messages */
function bubble(m,anim=true){
 const row=document.createElement("div");row.className="row "+m.r;if(!anim)row.style.animation="none";
 let inner="";
 if(m.v){inner=`<div class="msg"><div class="vm"><button class="pl" aria-label="Воспроизвести"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><div class="bars">${m.v.peaks.map(p=>`<i style="height:${Math.max(12,p*100)}%"></i>`).join("")}</div><time>${fmt(m.v.dur)}</time></div></div>`}
 else inner=`<div class="msg">${esc(m.t)}${m.slots?`<div class="slots">${m.slots.map(s=>`<button>${s}</button>`).join("")}</div>`:""}</div>`;
 row.innerHTML=(m.r==="b"?`<div class="av">${SPARK}</div>`:"")+`<div>${inner}</div>`;
 if(m.v)wireVoice(row,m.v);
 row.querySelectorAll(".slots button").forEach(b=>b.onclick=()=>{b.parentNode.remove();send(b.textContent)});
 return row;
}
function wireVoice(row,v){
 const a=new Audio(v.url),btn=row.querySelector(".pl"),bars=[...row.querySelectorAll(".bars i")],tm=row.querySelector("time");
 const P='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',S='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
 btn.onclick=()=>{if(a.paused){document.querySelectorAll("audio").forEach(x=>x.pause());a.play().catch(()=>toast("Не удалось воспроизвести запись"))}else a.pause()};
 a.onplay=()=>btn.innerHTML=S;a.onpause=()=>btn.innerHTML=P;
 a.onended=()=>{bars.forEach(b=>b.classList.remove("f"));tm.textContent=fmt(v.dur)};
 a.ontimeupdate=()=>{const k=Math.round(a.currentTime/v.dur*bars.length);bars.forEach((b,i)=>b.classList.toggle("f",i<k));tm.textContent=fmt(a.currentTime)};
}
function drawLog(){
 const l=$("log"),c=get();l.innerHTML="";
 if(!c.msgs.length){l.innerHTML=`<div class="welcome"><div class="orb"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 0c.8 7.2 4.8 11.2 12 12-7.2.8-11.2 4.8-12 12-.8-7.2-4.8-11.2-12-12C7.2 11.2 11.2 7.2 12 0z"/></svg></div><h2>Расскажите, <i>что беспокоит</i></h2><p>Напишите или надиктуйте своими словами. Я подберу врача и предложу время приёма.</p><div class="chips"><button>Болит голова</button><button>Повышенное давление</button><button>Ухудшилось зрение</button><button>Нужен чек-ап</button></div></div>`;
  l.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>send(b.textContent));return}
 c.msgs.forEach(m=>l.appendChild(bubble(m,false)));l.scrollTop=l.scrollHeight;
}
function push(m){const c=get();if(!c.msgs.length)$("log").innerHTML="";c.msgs.push(m);$("log").appendChild(bubble(m));$("log").scrollTop=1e9;drawHist()}
function reply(txt,voice){
 const c=get(),tp=document.createElement("div");tp.className="row b";tp.innerHTML=`<div class="av">${SPARK}</div><div class="msg typing"><i></i><i></i><i></i></div>`;
 $("log").appendChild(tp);$("log").scrollTop=1e9;
 const t=(txt||"").toLowerCase();let r;
 if(voice)r={t:"Прослушала ваше сообщение. Чтобы точнее подобрать врача, уточните, пожалуйста, как давно это началось и есть ли температура?"};
 else if(/голов|мигрен|сон|бессон/.test(t))r={t:"Рекомендую консультацию невролога — Сидоров Алексей Петрович, кандидат медицинских наук. Выберите удобное время:",slots:["Завтра, 10:30","Завтра, 14:00","Пт, 09:15"]};
 else if(/сердц|давлен|пульс|check|чек/.test(t))r={t:"Подойдёт кардиолог — Петрова Мария Сергеевна, доктор медицинских наук. Свободное время:",slots:["Сегодня, 18:00","Завтра, 11:00","Сб, 12:30"]};
 else if(/зрен|глаз|очк/.test(t))r={t:"Вам нужен офтальмолог — Иванов Иван Иванович, кандидат медицинских наук. Выберите время:",slots:["Завтра, 09:00","Пн, 15:30"]};
 else if(/(завтра|сегодня|пн|пт|сб),? \d/i.test(t))r={t:"Готово, вы записаны: "+txt+". Напоминание придёт за сутки. Нужна помощь с подготовкой к приёму?"};
 else r={t:"Поняла. Расскажите подробнее: где именно беспокоит, как давно и что усиливает симптомы? Тогда я подберу специалиста."};
 setTimeout(()=>{tp.remove();if(get()===c||true){c.msgs.push({r:"b",...r});if(get()===c){$("log").appendChild(bubble({r:"b",...r}));$("log").scrollTop=1e9}drawHist()}},1100+Math.random()*600);
}
function send(txt){
 txt=(txt||"").trim();if(!txt)return;const c=get();
 if(c.title==="Новый диалог"){c.title=txt.length>34?txt.slice(0,34)+"…":txt}
 push({r:"u",t:txt});reply(txt);
}

/* composer */
const inp=$("inp"),pill=$("pill");
function fit(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px";pill.classList.toggle("has",!!inp.value.trim())}
inp.oninput=fit;
inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend()}};
function doSend(){const v=inp.value;inp.value="";fit();send(v)}
$("sendBtn").onclick=doSend;

/* voice recording */
let R=null;const cv=$("wave"),cx=cv.getContext("2d");
async function startRec(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Запись голоса недоступна в этом браузере");return}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast("Нет доступа к микрофону. Разрешите его в настройках браузера.");return}
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),an=ac.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.8;
 ac.createMediaStreamSource(stream).connect(an);
 let mr=null,chunks=[];try{mr=new MediaRecorder(stream);mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);mr.start()}catch(e){stream.getTracks().forEach(t=>t.stop());toast("Не удалось начать запись");return}
 R={stream,ac,an,mr,chunks,t0:performance.now(),peaks:[],lvl:[],raf:0,send:false};
 pill.classList.add("rc");$("rec").setAttribute("aria-hidden","false");sizeCv();loop();
}
function sizeCv(){const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d}
function loop(){
 if(!R)return;const {an}=R,buf=new Uint8Array(an.fftSize);an.getByteTimeDomainData(buf);
 let s=0;for(const v of buf){const x=(v-128)/128;s+=x*x}const lvl=Math.min(1,Math.sqrt(s/buf.length)*3.2);
 R.lvl.push(lvl);if(R.lvl.length>200)R.lvl.shift();
 const el=(performance.now()-R.t0)/1000;if(!R.lastP||el-R.lastP>.08){R.peaks.push(lvl);R.lastP=el}
 $("rtime").textContent=fmt(el);
 const w=cv.width,h=cv.height,d=devicePixelRatio||1,bw=3*d,gap=3*d,n=Math.floor(w/(bw+gap));
 cx.clearRect(0,0,w,h);
 const g=cx.createLinearGradient(0,0,w,0);g.addColorStop(0,"rgba(143,217,196,.25)");g.addColorStop(.7,"#2A8796");g.addColorStop(1,"#8FD9C4");cx.fillStyle=g;
 for(let i=0;i<n;i++){
  const li=R.lvl.length-n+i,v=li>=0?R.lvl[li]:0,bh=Math.max(4*d,v*h*.92),x=i*(bw+gap),y=(h-bh)/2;
  cx.beginPath();cx.roundRect?cx.roundRect(x,y,bw,bh,bw/2):cx.rect(x,y,bw,bh);cx.fill();
 }
 if(el>=300)stopRec(true);
 R.raf=requestAnimationFrame(loop);
}
function stopRec(doSendIt){
 if(!R)return;const r=R;R=null;cancelAnimationFrame(r.raf);
 const dur=(performance.now()-r.t0)/1000;
 pill.classList.remove("rc");$("rec").setAttribute("aria-hidden","true");
 r.mr.onstop=()=>{
  r.stream.getTracks().forEach(t=>t.stop());r.ac.close();
  if(!doSendIt)return;
  if(dur<.8){toast("Запись слишком короткая");return}
  const blob=new Blob(r.chunks,{type:r.mr.mimeType||"audio/webm"}),url=URL.createObjectURL(blob);
  const N=40,peaks=[];for(let i=0;i<N;i++){const a=Math.floor(i*r.peaks.length/N),b=Math.max(a+1,Math.floor((i+1)*r.peaks.length/N));peaks.push(Math.max(...r.peaks.slice(a,b),0))}
  const mx=Math.max(...peaks,.2);
  const c=get();if(c.title==="Новый диалог")c.title="Голосовое сообщение";
  push({r:"u",v:{url,dur,peaks:peaks.map(p=>p/mx)}});reply("",true);
 };
 try{r.mr.stop()}catch(e){r.mr.onstop()}
}
$("micBtn").onclick=startRec;
$("sendRec").onclick=()=>stopRec(true);
$("cancelRec").onclick=()=>{stopRec(false);toast("Запись удалена")};
addEventListener("resize",()=>R&&sizeCv());
addEventListener("keydown",e=>{if(e.key==="Escape"){if(R){stopRec(false)}closeSide()}});

/* sidebar */
function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("on")}
$("burger").onclick=()=>{$("side").classList.add("open");$("scrim").classList.add("on")};
$("scrim").onclick=closeSide;$("newBtn").onclick=newConv;$("q").oninput=drawHist;

drawHist();drawLog();
